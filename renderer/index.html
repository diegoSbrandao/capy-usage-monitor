<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Spark Monitor</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-brand">
      <span class="brand-icon"></span>
      <span>Spark Monitor</span>
    </div>
    <div class="titlebar-actions">
      <button id="settingsBtn" title="Configuracoes">&#x2699;</button>
      <button id="minimizeBtn" title="Modo compacto">&#x2013;</button>
      <button id="closeBtn" title="Ocultar">&#x2715;</button>
    </div>
  </div>

  <div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-card account">
      <div id="accountDisconnected" class="account-row">
        <span class="account-hint">numeros estimados localmente</span>
        <button id="connectBtn" class="account-btn">Conectar conta</button>
      </div>
      <div id="accountPasteRow" class="account-row hidden">
        <input id="codeInput" class="code-input" type="text" placeholder="cole o codigo#state aqui" />
        <button id="submitCodeBtn" class="account-btn">Confirmar</button>
      </div>
      <div id="accountConnected" class="account-row hidden">
        <span class="account-connected-label">
          <span class="live-dot"></span>
          <span id="accountLabel">conectado</span>
        </span>
        <button id="logoutBtn" class="account-btn outline">Desconectar</button>
      </div>
      <div id="accountError" class="account-error hidden"></div>
    </div>

    <div class="settings-card">
      <div class="settings-row">
        <label for="dailyAlertToggle">Avisar ao atingir limite diario</label>
        <label class="switch">
          <input type="checkbox" id="dailyAlertToggle" />
          <span class="switch-track"><span class="switch-knob"></span></span>
        </label>
      </div>
    </div>

    <div class="settings-card">
      <div class="settings-row" id="dailyAlertPercentRow">
        <label for="dailyAlertPercent">Percentual do limite</label>
        <div class="settings-percent">
          <input type="number" id="dailyAlertPercent" min="0" max="100" step="5" />
          <span>%</span>
        </div>
      </div>
    </div>

    <button id="settingsSaveBtn" class="btn-primary">Salvar</button>

    <button id="exportBtn" class="btn-outline">Exportar Excel (por sessao)</button>
  </div>

  <div class="scene" id="scene">
    <div class="clock-chip">
      <span class="clock-dot"></span>
      <span id="clock">--:--</span>
    </div>
    <div class="sun"></div>
    <div class="moon"></div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <span class="star s1"></span>
    <span class="star s2"></span>
    <span class="star s3"></span>
    <span class="star s4"></span>
    <span class="star s5"></span>
    <span class="star s6"></span>

    <div id="spark" class="spark idle">
      <div class="mascot-grid">
        <div class="mp mp-body" style="grid-row:1;grid-column:4;"></div>
        <div class="mp mp-body" style="grid-row:1;grid-column:5;"></div>
        <div class="mp mp-body" style="grid-row:1;grid-column:6;"></div>
        <div class="mp mp-body" style="grid-row:1;grid-column:7;"></div>
        <div class="mp mp-body" style="grid-row:1;grid-column:8;"></div>
        <div class="mp mp-body" style="grid-row:2;grid-column:3;"></div>
        <div class="mp mp-body" style="grid-row:2;grid-column:4;"></div>
        <div class="mp mp-body" style="grid-row:2;grid-column:5;"></div>
        <div class="mp mp-body" style="grid-row:2;grid-column:6;"></div>
        <div class="mp mp-body" style="grid-row:2;grid-column:7;"></div>
        <div class="mp mp-body" style="grid-row:2;grid-column:8;"></div>
        <div class="mp mp-body" style="grid-row:2;grid-column:9;"></div>
        <div class="mp mp-body" style="grid-row:3;grid-column:2;"></div>
        <div class="mp mp-body" style="grid-row:3;grid-column:3;"></div>
        <div class="mp mp-body" style="grid-row:3;grid-column:4;"></div>
        <div class="mp mp-body" style="grid-row:3;grid-column:5;"></div>
        <div class="mp mp-body" style="grid-row:3;grid-column:6;"></div>
        <div class="mp mp-body" style="grid-row:3;grid-column:7;"></div>
        <div class="mp mp-body" style="grid-row:3;grid-column:8;"></div>
        <div class="mp mp-body" style="grid-row:3;grid-column:9;"></div>
        <div class="mp mp-body" style="grid-row:3;grid-column:10;"></div>
        <div class="mp mp-body" style="grid-row:4;grid-column:1;"></div>
        <div class="mp mp-body" style="grid-row:4;grid-column:2;"></div>
        <div class="mp mp-body" style="grid-row:4;grid-column:3;"></div>
        <div class="mp mp-body" style="grid-row:4;grid-column:4;"></div>
        <div class="mp mp-body" style="grid-row:4;grid-column:5;"></div>
        <div class="mp mp-body" style="grid-row:4;grid-column:6;"></div>
        <div class="mp mp-body" style="grid-row:4;grid-column:7;"></div>
        <div class="mp mp-body" style="grid-row:4;grid-column:8;"></div>
        <div class="mp mp-body" style="grid-row:4;grid-column:9;"></div>
        <div class="mp mp-body" style="grid-row:4;grid-column:10;"></div>
        <div class="mp mp-body" style="grid-row:4;grid-column:11;"></div>
        <div class="mp mp-body" style="grid-row:5;grid-column:1;"></div>
        <div class="mp mp-body" style="grid-row:5;grid-column:2;"></div>
        <div class="mp mp-eye" style="grid-row:5;grid-column:3;"></div>
        <div class="mp mp-body" style="grid-row:5;grid-column:4;"></div>
        <div class="mp mp-body" style="grid-row:5;grid-column:5;"></div>
        <div class="mp mp-body" style="grid-row:5;grid-column:6;"></div>
        <div class="mp mp-body" style="grid-row:5;grid-column:7;"></div>
        <div class="mp mp-body" style="grid-row:5;grid-column:8;"></div>
        <div class="mp mp-eye" style="grid-row:5;grid-column:9;"></div>
        <div class="mp mp-body" style="grid-row:5;grid-column:10;"></div>
        <div class="mp mp-body" style="grid-row:5;grid-column:11;"></div>
        <div class="mp mp-body" style="grid-row:6;grid-column:1;"></div>
        <div class="mp mp-body" style="grid-row:6;grid-column:2;"></div>
        <div class="mp mp-body" style="grid-row:6;grid-column:3;"></div>
        <div class="mp mp-body" style="grid-row:6;grid-column:4;"></div>
        <div class="mp mp-body" style="grid-row:6;grid-column:5;"></div>
        <div class="mp mp-body" style="grid-row:6;grid-column:6;"></div>
        <div class="mp mp-body" style="grid-row:6;grid-column:7;"></div>
        <div class="mp mp-body" style="grid-row:6;grid-column:8;"></div>
        <div class="mp mp-body" style="grid-row:6;grid-column:9;"></div>
        <div class="mp mp-body" style="grid-row:6;grid-column:10;"></div>
        <div class="mp mp-body" style="grid-row:6;grid-column:11;"></div>
        <div class="mp mp-body" style="grid-row:7;grid-column:1;"></div>
        <div class="mp mp-body" style="grid-row:7;grid-column:2;"></div>
        <div class="mp mp-body" style="grid-row:7;grid-column:3;"></div>
        <div class="mp mp-body" style="grid-row:7;grid-column:4;"></div>
        <div class="mp mp-mouth" style="grid-row:7;grid-column:5;"></div>
        <div class="mp mp-mouth" style="grid-row:7;grid-column:6;"></div>
        <div class="mp mp-mouth" style="grid-row:7;grid-column:7;"></div>
        <div class="mp mp-body" style="grid-row:7;grid-column:8;"></div>
        <div class="mp mp-body" style="grid-row:7;grid-column:9;"></div>
        <div class="mp mp-body" style="grid-row:7;grid-column:10;"></div>
        <div class="mp mp-body" style="grid-row:7;grid-column:11;"></div>
        <div class="mp mp-body" style="grid-row:8;grid-column:1;"></div>
        <div class="mp mp-body" style="grid-row:8;grid-column:2;"></div>
        <div class="mp mp-body" style="grid-row:8;grid-column:3;"></div>
        <div class="mp mp-body" style="grid-row:8;grid-column:4;"></div>
        <div class="mp mp-body" style="grid-row:8;grid-column:5;"></div>
        <div class="mp mp-body" style="grid-row:8;grid-column:6;"></div>
        <div class="mp mp-body" style="grid-row:8;grid-column:7;"></div>
        <div class="mp mp-body" style="grid-row:8;grid-column:8;"></div>
        <div class="mp mp-body" style="grid-row:8;grid-column:9;"></div>
        <div class="mp mp-body" style="grid-row:8;grid-column:10;"></div>
        <div class="mp mp-body" style="grid-row:8;grid-column:11;"></div>
        <div class="mp mp-leg-a" style="grid-row:9;grid-column:2;"></div>
        <div class="mp mp-leg-b" style="grid-row:9;grid-column:4;"></div>
        <div class="mp mp-leg-b" style="grid-row:9;grid-column:8;"></div>
        <div class="mp mp-leg-a" style="grid-row:9;grid-column:10;"></div>
        <div class="mp mp-leg-a" style="grid-row:10;grid-column:2;"></div>
        <div class="mp mp-leg-b" style="grid-row:10;grid-column:4;"></div>
        <div class="mp mp-leg-b" style="grid-row:10;grid-column:8;"></div>
        <div class="mp mp-leg-a" style="grid-row:10;grid-column:10;"></div>
      </div>

      <div class="spark-glasses">
        <div class="lens"></div>
        <div class="lens"></div>
      </div>
      <div class="spark-zzz">Z z z</div>
      <div class="attention-badge"></div>

      <div class="flag">
        <div class="flag-pole"></div>
        <div class="flag-cloth"></div>
      </div>

      <div class="prop mug">
        <div class="mug-cup"></div>
        <div class="mug-handle"></div>
        <div class="steam s1"></div>
        <div class="steam s2"></div>
      </div>

      <div class="prop tv">
        <div class="tv-antenna a1"></div>
        <div class="tv-antenna a2"></div>
        <div class="tv-body">
          <div class="tv-screen"></div>
        </div>
      </div>

      <div class="prop card card-read">
        <div class="card-title">arquivo.md</div>
        <div class="card-line title"></div>
        <div class="card-line short"></div>
        <div class="card-line"></div>
        <div class="card-line short"></div>
      </div>

      <div class="prop card card-run">
        <div class="card-dots"><span></span><span></span><span></span></div>
        <div class="card-line term">&gt; Rodando<span class="blink">.</span></div>
        <div class="card-line term ok">&#10003; Lendo arquivos</div>
        <div class="card-line term spin"><span class="spinner"></span>Aguardando</div>
      </div>

      <div class="prop card card-edit">
        <div class="card-line code green"></div>
        <div class="card-line code blue short"></div>
        <div class="card-line code yellow"></div>
        <div class="plant"><div class="plant-leaf l1"></div><div class="plant-leaf l2"></div><div class="plant-pot"></div></div>
      </div>

      <div class="spark-burst">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div class="spark-footer">
      <div class="spark-status">
        <span id="statusDot" class="status-dot"></span>
        <span id="sparkStatus">tranquilo</span>
      </div>
      <div class="compact-pct-row">
        <span id="compactDot" class="compact-dot"></span>
        <span id="compactPct" class="compact-pct">0%</span>
      </div>
    </div>
  </div>

  <div class="metric-card">
    <div class="metric-top">
      <div class="metric-name">
        <span>Sessao (5h)</span>
        <span id="sessionBadge" class="badge"></span>
      </div>
      <span id="sessionSubtext" class="metric-subtext"></span>
    </div>
    <div class="metric-bottom">
      <div class="bar-track"><div id="sessionBar" class="bar-fill"></div></div>
      <span id="sessionValue" class="metric-value">-</span>
    </div>
  </div>

  <div class="metric-card">
    <div class="metric-top">
      <div class="metric-name">
        <span>Hoje</span>
        <span class="badge badge-personal" title="Nao existe limite diario oficial da Anthropic. Isso e so um teto pessoal configuravel em config.json (dailyLimitTokens), pra voce acompanhar seu proprio ritmo.">teto pessoal</span>
      </div>
      <span id="dailySubtext" class="metric-subtext"></span>
    </div>
    <div class="metric-bottom">
      <div class="bar-track"><div id="dailyBar" class="bar-fill"></div></div>
      <span id="dailyValue" class="metric-value">-</span>
    </div>
  </div>

  <div class="metric-card">
    <div class="metric-top">
      <div class="metric-name">
        <span>Semana</span>
        <span id="weeklyBadge" class="badge"></span>
      </div>
      <span id="weeklySubtext" class="metric-subtext"></span>
    </div>
    <div class="metric-bottom">
      <div class="bar-track"><div id="weeklyBar" class="bar-fill"></div></div>
      <span id="weeklyValue" class="metric-value">-</span>
    </div>
  </div>

  <div class="section">
    <div class="label-row"><span>Por modelo <span class="label-sub">(7 dias)</span></span></div>
    <div id="modelBreakdown" class="model-list"></div>
  </div>

  <div class="section hidden" id="estCostSection">
    <div class="label-row">
      <span>Token estimado <span class="label-sub">(7d)</span></span>
      <span id="estCost" class="metric-value">-</span>
    </div>
  </div>

  <div class="section">
    <div class="label-row">
      <span>Ultimos 30 dias</span>
      <span id="heatmapTotal" class="metric-value">-</span>
    </div>
    <div id="heatmap" class="heatmap"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
