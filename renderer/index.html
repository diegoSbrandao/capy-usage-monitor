<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Spark Monitor</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar">
    <span>Spark Monitor</span>
    <button id="closeBtn" title="Ocultar">&#x2715;</button>
  </div>

  <div class="account">
    <div id="accountDisconnected" class="account-row">
      <span class="account-hint">numeros estimados localmente</span>
      <button id="connectBtn" class="account-btn">Conectar conta</button>
    </div>
    <div id="accountPasteRow" class="account-row hidden">
      <input id="codeInput" class="code-input" type="text" placeholder="cole o codigo#state aqui" />
      <button id="submitCodeBtn" class="account-btn">Confirmar</button>
    </div>
    <div id="accountConnected" class="account-row hidden">
      <span id="accountLabel" class="account-hint">conectado</span>
      <button id="logoutBtn" class="account-btn subtle">Desconectar</button>
    </div>
    <div id="accountError" class="account-error hidden"></div>
  </div>

  <div class="scene">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <span class="star s1">+</span>
    <span class="star s2">+</span>
    <span class="star s3">+</span>
    <span class="star s4">+</span>
    <span class="star s5">+</span>
    <span class="star s6">+</span>

    <div id="spark" class="spark idle">
      <div class="spark-shape"></div>
      <div class="spark-eye left"></div>
      <div class="spark-eye right"></div>
      <div class="spark-glasses">
        <div class="lens"></div>
        <div class="lens"></div>
      </div>
      <div class="spark-leg left"></div>
      <div class="spark-leg right"></div>

      <div class="prop mug">
        <div class="mug-cup"></div>
        <div class="mug-handle"></div>
        <div class="steam s1"></div>
        <div class="steam s2"></div>
      </div>

      <div class="prop card card-read">
        <div class="card-title">arquivo.md</div>
        <div class="card-line title"></div>
        <div class="card-line short"></div>
        <div class="card-line"></div>
        <div class="card-line short"></div>
      </div>

      <div class="prop card card-run">
        <div class="card-dots"><span></span><span></span><span></span></div>
        <div class="card-line term">&gt; Rodando<span class="blink">.</span></div>
        <div class="card-line term ok">&#10003; Lendo arquivos</div>
        <div class="card-line term spin"><span class="spinner"></span>Aguardando</div>
      </div>

      <div class="prop card card-edit">
        <div class="card-line code green"></div>
        <div class="card-line code blue short"></div>
        <div class="card-line code yellow"></div>
        <div class="plant"><div class="plant-leaf l1"></div><div class="plant-leaf l2"></div><div class="plant-pot"></div></div>
      </div>

      <div class="spark-burst">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div id="sparkStatus" class="spark-status">tranquilo</div>
  </div>

  <div class="section">
    <div class="label-row">
      <span>Sessao (5h) <span id="sessionTag" class="tag"></span></span>
      <span id="sessionTokens">-</span>
    </div>
    <div class="bar-track"><div id="sessionBar" class="bar-fill"></div></div>
  </div>

  <div class="section">
    <div class="label-row">
      <span>Hoje <span class="tag">estimado</span></span>
      <span id="dailyTokens">-</span>
    </div>
    <div class="bar-track"><div id="dailyBar" class="bar-fill"></div></div>
  </div>

  <div class="section">
    <div class="label-row">
      <span>Semana <span id="weeklyTag" class="tag"></span></span>
      <span id="weeklyTokens">-</span>
    </div>
    <div class="bar-track"><div id="weeklyBar" class="bar-fill"></div></div>
  </div>

  <div class="section">
    <div class="label-row">
      <span>Mes <span class="tag">estimado</span></span>
      <span id="monthlyTokens">-</span>
    </div>
    <div class="bar-track"><div id="monthlyBar" class="bar-fill"></div></div>
  </div>

  <div class="section">
    <div class="label-row"><span>Por modelo (7 dias)</span></div>
    <div id="modelBreakdown" class="model-list"></div>
  </div>

  <div class="section">
    <div class="label-row">
      <span>Custo estimado (7d)</span>
      <span id="estCost">-</span>
    </div>
  </div>

  <div class="section">
    <div class="label-row"><span>Ultimos 30 dias</span></div>
    <div id="heatmap" class="heatmap"></div>
  </div>

  <button id="exportBtn" class="export-btn">Exportar Excel (por sessao)</button>

  <script src="renderer.js"></script>
</body>
</html>
